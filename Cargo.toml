[package]
name = "bardado"
version = "0.5.0"
edition = "2021"
publish = false


[dependencies]
poise = "0.6.1"
serenity = { version = "0.12", default-features = false, features = [
    "http",
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "voice", 
    "cache",
    "standard_framework"]}
songbird = { version = "0.4", default-features = false, features = ["builtin-queue", "serenity"]}
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
tokio-util = "0.7.18"
rand = "0.10.0"
regex = "1.12.3"
reqwest = "0.12.0"
calc_engine = "0.4.1"

once_cell = "1.21.3"
